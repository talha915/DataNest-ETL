networks:
  spark-net:
    driver: bridge

services:

  # ============================================
  # SPARK MASTER
  # JVM: 512 MB  |  Container: 512 MB
  # ============================================
  spark-master:
    image: apache/spark:3.5.7
    container_name: spark-master
    hostname: spark-master
    user: root
    networks:
      - spark-net
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_MASTER_WEBUI_PORT=8080
      - SPARK_DAEMON_MEMORY=512m
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./:/opt/spark-apps
      - ./spark-logs:/opt/spark/spark-logs
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ============================================
  # SPARK WORKER 1
  # Worker JVM: 512 MB  |  Executor budget: 512 MB  |  Container: 1.25 GB
  # ============================================
  spark-worker-1:
    image: apache/spark:3.5.7
    container_name: spark-worker-1
    hostname: spark-worker-1
    user: root
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - spark-net
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 8081
      --cores 2
      --memory 512m
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=512m
      - SPARK_WORKER_WEBUI_PORT=8081
      - SPARK_DAEMON_MEMORY=256m
      - SPARK_LOCAL_DIRS=/tmp/spark
    deploy:
      resources:
        limits:
          memory: 1280m
        reservations:
          memory: 768m
    ports:
      - "8081:8081"
    volumes:
      - ./:/opt/spark-apps
      - ./spark-logs:/opt/spark/spark-logs
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

  # ============================================
  # SPARK WORKER 2
  # Same as worker-1
  # ============================================
  spark-worker-2:
    image: apache/spark:3.5.7
    container_name: spark-worker-2
    hostname: spark-worker-2
    user: root
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - spark-net
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 8082
      --cores 2
      --memory 512m
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=512m
      - SPARK_WORKER_WEBUI_PORT=8082
      - SPARK_DAEMON_MEMORY=256m
      - SPARK_LOCAL_DIRS=/tmp/spark
    deploy:
      resources:
        limits:
          memory: 1280m
        reservations:
          memory: 768m
    ports:
      - "8082:8082"
    volumes:
      - ./:/opt/spark-apps
      - ./spark-logs:/opt/spark/spark-logs
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

  # ============================================
  # SPARK CLIENT (Driver)
  # Driver JVM: 512 MB (spark-submit)  |  Container: 768 MB
  # ============================================
  spark-client:
    image: apache/spark:3.5.7
    container_name: spark-client
    hostname: spark-client
    user: root
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
    networks:
      - spark-net
    environment:
      - SPARK_NO_DAEMONIZE=true
      - PYSPARK_PYTHON=python3
    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 512m
    ports:
      - "4040:4040"
    volumes:
      - ./:/opt/spark-apps
      - ./spark-logs:/opt/spark/spark-logs
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    command: tail -f /dev/null
    working_dir: /opt/spark-apps

  # ============================================
  # SPARK HISTORY SERVER
  # JVM: 256 MB  |  Container: 256 MB
  # ============================================
  spark-history:
    image: apache/spark:3.5.7
    container_name: spark-history
    hostname: spark-history
    user: root
    depends_on:
      - spark-master
    networks:
      - spark-net
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_HISTORY_OPTS=-Dspark.history.fs.logDirectory=/opt/spark/spark-logs -Dspark.history.ui.port=18080
      - SPARK_DAEMON_MEMORY=256m
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m
    ports:
      - "18080:18080"
    volumes:
      - ./spark-logs:/opt/spark/spark-logs
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    command: >
      /opt/spark/sbin/start-history-server.sh
